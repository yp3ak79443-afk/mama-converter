<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff5a36">
<title>媽媽好難｜蝦皮推廣連結轉換器</title>
<meta name="description" content="媽媽好難｜快速轉換蝦皮推廣連結，方便分享與複製。">
<style>
*{box-sizing:border-box}
:root{
  --accent:#ff5a36;
  --accent2:#ff7a59;
  --text:#222;
  --muted:#777;
  --bg:#f6f7f9;
  --card:#fff;
  --line:#e9e9e9;
  --success:#20a464;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color:var(--text);
  background:linear-gradient(180deg,#fff7f3 0,#f7f8fa 42%,#f4f5f7 100%);
}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 50px}
.brand{text-align:center;margin:10px 0 24px}
.logo{
  width:68px;height:68px;border-radius:20px;margin:0 auto 12px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--accent),#ff936f);
  color:#fff;font-size:31px;font-weight:900;
  box-shadow:0 10px 25px rgba(255,90,54,.2)
}
h1{font-size:30px;letter-spacing:.5px;margin:0 0 6px}
.subtitle{margin:0;color:#777;font-size:15px}
.card{
  background:var(--card);border:1px solid rgba(0,0,0,.05);
  border-radius:22px;padding:22px;box-shadow:0 12px 35px rgba(0,0,0,.06)
}
label{display:block;font-weight:800;margin:0 0 10px}
textarea{
  width:100%;min-height:180px;resize:vertical;border:1px solid var(--line);
  border-radius:15px;padding:15px;font:inherit;font-size:15px;line-height:1.6;
  outline:none;background:#fff;transition:.2s
}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(255,90,54,.1)}
.hint{font-size:13px;color:#888;margin:8px 2px 0}
.row{display:flex;gap:10px;margin-top:16px}
button{
  border:0;border-radius:13px;padding:14px 18px;font:inherit;font-weight:800;
  cursor:pointer;transition:transform .08s,opacity .2s
}
button:active{transform:scale(.98)}
.primary{flex:1;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 18px rgba(255,90,54,.2)}
.secondary{background:#f1f2f4;color:#444}
.result{margin-top:18px;display:none}
.result.show{display:block}
.status{
  padding:13px 15px;border-radius:13px;background:#effaf4;color:var(--success);
  font-weight:800;margin-bottom:12px
}
.item{border:1px solid var(--line);border-radius:15px;padding:14px;margin-top:10px;background:#fff}
.item-title{font-weight:800;font-size:14px;margin-bottom:8px}
.link{
  background:#f7f7f8;border-radius:10px;padding:10px;font-size:12px;
  line-height:1.5;word-break:break-all;color:#555
}
.copy{
  width:100%;margin-top:9px;background:#222;color:#fff;padding:11px
}
.copy.done{background:var(--success)}
.bottom{margin-top:18px;text-align:center;color:#999;font-size:12px;line-height:1.7}
.note{margin-top:14px;padding:12px 14px;border-radius:12px;background:#fff7e9;color:#8a5b12;font-size:13px;line-height:1.6}
@media(max-width:520px){
  .wrap{padding:20px 13px 40px}
  h1{font-size:26px}.card{padding:17px;border-radius:19px}
  textarea{min-height:160px}.row{gap:8px}
}
</style>
</head>
<body>
<main class="wrap">
  <section class="brand">
    <div class="logo">媽</div>
    <h1>媽媽好難</h1>
    <p class="subtitle">蝦皮推廣連結轉換器</p>
  </section>

  <section class="card">
    <label for="links">蝦皮連結</label>
    <textarea id="links" placeholder="請貼上蝦皮商品連結&#10;&#10;例如：&#10;https://s.shopee.tw/xxxxx&#10;https://shopee.tw/xxxxx"></textarea>
    <div class="hint">一次最多 5 個連結，每行一個。</div>

    <div class="row">
      <button class="primary" id="convert">產生推廣連結</button>
      <button class="secondary" id="clear">清除</button>
    </div>

    <div class="note">
      本工具會使用你的蝦皮推廣帳號產生推廣導流網址。若要更換 Affiliate ID，請修改程式最下方的設定值。
    </div>

    <section class="result" id="result">
      <div class="status" id="status"></div>
      <div id="items"></div>
      <button class="primary" id="copyAll" style="margin-top:12px">全部複製</button>
    </section>
  </section>

  <div class="bottom">
    媽媽好難 · Shopee 推廣連結工具<br>
    請依蝦皮分潤計畫規範使用。
  </div>
</main>

<script>
/* ==============================
   媽媽好難｜蝦皮轉換器設定
   ============================== */
const AFFILIATE_ID = "16339760008";

/*
  如果未來你有自己的後端 API，
  可以把 USE_DIRECT_REDIRECT 改成 false，
  再把 API_URL 填成你的 API。
*/
const USE_DIRECT_REDIRECT = true;
const API_URL = ""; // 例如：https://你的網域/api/convert

const $ = id => document.getElementById(id);

function cleanUrl(raw){
  return raw.trim().replace(/^["'<>]+|["'<>]+$/g,"");
}

function isShopeeUrl(url){
  try{
    const u = new URL(url);
    const host = u.hostname.toLowerCase();
    return host.includes("shopee.tw") || host.includes("s.shopee.tw");
  }catch(e){ return false; }
}

function makeDirectLink(original){
  return "https://s.shopee.tw/an_redir?origin_link=" +
    encodeURIComponent(original) +
    "&affiliate_id=" + encodeURIComponent(AFFILIATE_ID);
}

async function makeLink(original){
  if(USE_DIRECT_REDIRECT) return makeDirectLink(original);

  const res = await fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({url:original,affiliate_id:AFFILIATE_ID})
  });
  if(!res.ok) throw new Error("API 轉換失敗");
  const data = await res.json();
  return data.url || data.link;
}

$("convert").addEventListener("click", async ()=>{
  const raw = $("links").value;
  const list = [...new Set(raw.split(/\n+/).map(cleanUrl).filter(Boolean))].slice(0,5);

  if(!list.length){
    alert("請先貼上蝦皮連結");
    return;
  }

  const invalid = list.filter(x => !isShopeeUrl(x));
  if(invalid.length){
    alert("偵測到非蝦皮網址，請確認後再試一次。");
    return;
  }

  $("convert").disabled = true;
  $("convert").textContent = "轉換中…";
  $("items").innerHTML = "";

  try{
    const links = await Promise.all(list.map(makeLink));
    $("status").textContent = `✓ 已成功產生 ${links.length} 個推廣連結`;
    links.forEach((link,i)=>{
      const item = document.createElement("div");
      item.className = "item";
      item.innerHTML = `
        <div class="item-title">推廣連結 ${i+1}</div>
        <div class="link">${escapeHtml(link)}</div>
        <button class="copy" data-link="${escapeAttr(link)}">複製連結</button>
      `;
      $("items").appendChild(item);
    });

    document.querySelectorAll(".copy").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        await navigator.clipboard.writeText(btn.dataset.link);
        btn.textContent = "✓ 已複製";
        btn.classList.add("done");
        setTimeout(()=>{btn.textContent="複製連結";btn.classList.remove("done")},1500);
      });
    });

    $("result").classList.add("show");
  }catch(e){
    alert("轉換失敗：" + e.message);
  }finally{
    $("convert").disabled = false;
    $("convert").textContent = "產生推廣連結";
  }
});

$("copyAll").addEventListener("click", async ()=>{
  const links = [...document.querySelectorAll(".copy")].map(x=>x.dataset.link);
  if(!links.length) return;
  await navigator.clipboard.writeText(links.join("\n"));
  $("copyAll").textContent = "✓ 全部已複製";
  setTimeout(()=>$("copyAll").textContent="全部複製",1500);
});

$("clear").addEventListener("click", ()=>{
  $("links").value = "";
  $("items").innerHTML = "";
  $("result").classList.remove("show");
});

function escapeHtml(s){
  return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function escapeAttr(s){
  return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;");
}
</script>
</body>
</html>
