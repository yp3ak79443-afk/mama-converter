<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>媽媽好難｜蝦皮推廣連結轉換器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="brand">媽媽好難｜省錢攻略</div>

      <h1>蝦皮推廣連結轉換器</h1>
      <p class="subtitle">快速轉換連結套用專屬優惠券!!!</p>

      <label class="label" for="urls">蝦皮連結</label>
      <textarea id="urls" placeholder="請貼上蝦皮連結，每行一個"></textarea>

      <div class="actions">
        <button id="convertBtn" class="btn btn-primary" type="button">產生推廣連結</button>
        <button id="clearBtn" class="btn btn-light" type="button">清除</button>
      </div>

      <a class="line-btn" href="https://line.me/" target="_blank" rel="noopener noreferrer">
        加入 LINE 社群看更多優惠
      </a>

      <div id="status" class="status" hidden></div>

      <section id="resultBox" class="result-box" hidden>
        <div class="result-title">推廣連結</div>
        <ol id="results"></ol>
        <button id="copyAllBtn" class="copy-btn" type="button">一鍵複製全部</button>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
